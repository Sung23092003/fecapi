<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Xem bài viết - NiceAdmin</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="assets/vendor/quill/quill.snow.css" rel="stylesheet">
  <link href="assets/vendor/quill/quill.bubble.css" rel="stylesheet">
  <link href="assets/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link href="assets/vendor/simple-datatables/style.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="assets/css/style.css" rel="stylesheet">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      max-width: 100%;
      max-height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
    }

    #main{
        width: 100%;
        height: 100%;
        min-width: 100%;
        min-height: 100%;
        max-width: 100%;
        max-height: 100%;
        margin: 0;
        padding: 0;
    }

    .view-container {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      max-width: 100%;
      max-height: 100%;
      margin: 0;
      padding: 0;
    }
    .view-card {
      background: white;
      border-radius: 0;
      box-shadow: none;
      padding: 40px;
      width: 100%;
      min-height: 100vh;
    }
    .view-header {
      border-bottom: 1px solid #e9ecef;
      margin-bottom: 30px;
      padding-bottom: 20px;
    }
    .view-title {
      font-size: 28px;
      font-weight: 600;
      color: #212529;
      margin: 0 0 10px 0;
    }
    .view-meta {
      display: flex;
      gap: 20px;
      margin: 15px 0 0 0;
      font-size: 13px;
      color: #6c757d;
    }
    .view-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .view-intro {
      font-size: 16px;
      line-height: 1.5;
      color: #495057;
      margin: 20px 0;
      padding: 15px;
      background: #f8f9fa;
      border-left: 3px solid #0d6efd;
    }
    .view-content {
      font-size: 16px;
      line-height: 1.8;
      color: #333;
    }
    .view-content img {
      max-width: 100%;
      height: auto;
      margin: 20px 0;
    }
    .view-content p, .view-content ul, .view-content ol {
      margin-bottom: 15px;
    }
    .view-footer {
      border-top: 1px solid #e9ecef;
      margin-top: 30px;
      padding-top: 20px;
      text-align: center;
    }
    .view-footer .btn {
      padding: 8px 20px;
      font-size: 14px;
    }
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }
    .error-box {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      padding: 15px;
      color: #721c24;
      margin: 20px 0;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.active {
      background: #d4edda;
      color: #155724;
    }
    .status-badge.inactive {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>

<body>

  <main id="main" class="view-container">
    <div class="view-card">
      <div id="content-area">
        <div class="loading-spinner">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Đang tải...</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Vendor JS Files -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- Template Main JS File -->
  <script src="assets/js/main.js"></script>

  <!-- Auth + ENV -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/config.js"></script>

  <script>
    (function () {
      "use strict";

      const contentArea = document.getElementById('content-area');
      const params = new URLSearchParams(window.location.search);
      const staticId = params.get('id');

      async function loadStaticDetail(id) {
        if (!id) {
          contentArea.innerHTML = '<div class="error-box">Không tìm thấy ID bài viết</div>';
          return;
        }

        try {
          const url = `${ENV.BASE_URL}/admin/statics/edit/${id}`;
          const headers = Auth.getAuthHeader();
          const res = await fetch(url, { headers, method: 'GET' });

          if (!res.ok) {
            throw new Error(`API error: ${res.status}`);
          }

          const json = await res.json();

          if (!json.success || !json.data) {
            throw new Error(json.message || 'Không lấy được dữ liệu');
          }

          const data = json.data.data || json.data;
          renderDetail(data);
        } catch (error) {
          console.error('Error loading static detail:', error);
          contentArea.innerHTML = `<div class="error-box">Lỗi: ${escapeHtml(error.message)}</div>`;
        }
      }

      function formatDateTime(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp * 1000);
        return date.toLocaleString('vi-VN');
      }

      function escapeHtml(text) {
        if (!text) return '';
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return String(text).replace(/[&<>"']/g, m => map[m]);
      }

      function renderDetail(data) {
        const statusClass = data.statics_status === 1 ? 'active' : 'inactive';
        const statusText = data.statics_status === 1 ? 'Đang hiển thị' : 'Ẩn';
        const createdDate = formatDateTime(data.statics_created);

        let html = '<div class="view-header">';
        html += `<h1 class="view-title">${escapeHtml(data.statics_title || '')}</h1>`;
        html += '<div class="view-meta">';
        html += `<span class="view-meta-item"><i class="bi bi-calendar-event"></i> ${createdDate}</span>`;
    
        html += '</div>';
        html += '</div>';

        if (data.statics_intro) {
          html += `<div class="view-intro">${escapeHtml(data.statics_intro)}</div>`;
        }

        html += '<div class="view-content">';
        html += data.statics_content || '<p>Không có nội dung</p>';
        html += '</div>';

        contentArea.innerHTML = html;
      }

      if (staticId) {
        loadStaticDetail(staticId);
      } else {
        contentArea.innerHTML = '<div class="error-box">Không tìm thấy ID bài viết trong URL</div>';
      }
    })();
  </script>
</body>

</html>
